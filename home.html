<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clais HTTPS Browser</title>
<style>
  :root { --bg:#000; --card:#161616; --text:#fff; --sub:#9ca3af; --border:#374151; --btn:#4b5563; --btnh:#6b7280; }
  body.light { --bg:#f3f4f6; --card:#fff; --text:#111827; --sub:#4b5563; --border:#d1d5db; --btn:#6b7280; --btnh:#4b5563; }
  * { box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  body { background:var(--bg); color:var(--text); margin:0; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .top { position:absolute; top:18px; right:22px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  button, a.btn { background:var(--btn); color:#fff; border:none; padding:10px 18px; border-radius:12px; cursor:pointer; text-decoration:none; font-size:15px; font-weight:600; }
  button:hover, a.btn:hover { background:var(--btnh); }
  .pro { background:#ff5500; } .pro:hover { background:#e04b00; }
  h1 { color:#ff5500; font-size:2.6rem; margin-bottom:8px; }
  p.sub { color:var(--sub); margin-bottom:26px; }
  form { display:flex; width:92%; max-width:560px; margin-bottom:28px; }
  form input { flex:1; padding:14px 18px; border-radius:14px 0 0 14px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:16px; outline:none; }
  form button { border-radius:0 14px 14px 0; padding:14px 24px; }
  .links { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); align-items:center; justify-content:center; z-index:50; }
  .box { background:var(--card); border:1px solid var(--border); padding:24px; border-radius:16px; width:92%; max-width:410px; display:flex; flex-direction:column; gap:12px; }
  .box input, .box textarea, .box select { padding:11px 14px; border-radius:10px; background:var(--bg); color:var(--text); border:1px solid var(--border); font-size:14px; outline:none; }
  .err { color:#ff5500; font-size:13px; min-height:18px; }
  .row { display:flex; gap:8px; justify-content:flex-end; }
</style>
</head>
<body>
  <div class="top">
    <button onclick="toggleTheme()" id="themeBtn">☀ Light Mode</button>
    <button onclick="toggleLang()">EN ⇄ IT</button>
    <button onclick="openBox('trBox')">🌐 Translator (190+)</button>
    <span id="usrBadge" style="font-weight:bold; color:#ff5500;"></span>
    <button id="inBtn" onclick="openBox('inBox')">Sign In</button>
    <button id="upBtn" onclick="openBox('upBox')">Sign Up</button>
    <button id="outBtn" style="display:none;" onclick="logout()">Logout</button>
    <a class="btn pro" href="https://buy.stripe.com/test_aFa28qgXI0iLfA0gxh97G00">★ Upgrade</a>
  </div>

  <h1>Clais HTTPS Browser</h1>
  <p class="sub">Private HTTPS Navigation • Any Website Worldwide</p>

  <form onsubmit="event.preventDefault(); let u=q.value.trim(); if(u) location.href=u.startsWith('http')?u:'https://'+u;">
    <input id="q" placeholder="Enter any HTTPS website (e.g. youtube.com)..." autofocus>
    <button class="pro" id="goBtn">Go</button>
  </form>

  <div class="links">
    <a class="btn" href="https://youtube.com">YouTube</a>
    <a class="btn" href="https://netlify.com">Netlify</a>
    <a class="btn" href="https://vscode.dev">VS Code</a>
    <a class="btn" href="https://github.com">GitHub</a>
    <a class="btn" href="https://wikipedia.org">Wikipedia</a>
  </div>

  <!-- Sign Up -->
  <div class="overlay" id="upBox"><div class="box">
    <h2 style="margin:0">Create Account (Sign Up)</h2>
    <div class="err" id="upErr"></div>
    <input id="fn" placeholder="First Name">
    <input id="ln" placeholder="Last Name">
    <input id="gm" type="email" placeholder="Gmail (example@gmail.com)">
    <input id="pw1" type="password" placeholder="Password (min 11 chars, last special)">
    <input id="pw2" type="password" placeholder="Repeat Password">
    <div class="row"><button onclick="closeBox('upBox')">Cancel</button><button class="pro" onclick="registerUser()">Sign Up</button></div>
  </div></div>

  <!-- Sign In -->
  <div class="overlay" id="inBox"><div class="box">
    <h2 style="margin:0">Sign In</h2>
    <div class="err" id="inErr"></div>
    <input id="inGm" type="email" placeholder="Gmail">
    <input id="inPw" type="password" placeholder="Password">
    <div class="row"><button onclick="closeBox('inBox')">Cancel</button><button class="pro" onclick="loginUser()">Sign In</button></div>
  </div></div>

  <!-- World Translator (190+ Languages) -->
  <div class="overlay" id="trBox"><div class="box">
    <h2 style="margin:0">World Translator</h2>
    <div style="display:flex;gap:6px">
      <select id="s" style="flex:1"></select>
      <button onclick="[s.value,t.value]=[t.value,s.value]">⇄</button>
      <select id="t" style="flex:1"></select>
    </div>
    <textarea id="tin" rows="3" placeholder="Type text to translate..."></textarea>
    <textarea id="tout" rows="3" placeholder="Translation output..." readonly></textarea>
    <div class="row"><button onclick="closeBox('trBox')">Close</button><button class="pro" onclick="trRun()">Translate</button></div>
  </div></div>

<script>
  const CODES = ["aa","ab","af","ak","am","an","ar","as","av","ay","az","ba","be","bg","bh","bi","bm","bn","bo","br","bs","ca","ce","ceb","ch","ckb","co","cr","cs","cu","cv","cy","da","de","dv","dz","ee","el","en","eo","es","et","eu","fa","ff","fi","fil","fj","fo","fr","fy","ga","gd","gl","gn","gu","gv","ha","haw","he","hi","hmn","ho","hr","ht","hu","hy","hz","ia","id","ie","ig","ii","ik","ilo","io","is","it","iu","ja","jv","ka","kg","ki","kj","kk","kl","km","kn","ko","kr","ks","ku","kv","kw","ky","la","lb","lg","li","ln","lo","lt","lu","lv","mg","mh","mi","mk","ml","mn","mni","mr","ms","mt","my","na","nb","nd","ne","ng","nl","nn","no","nr","nv","ny","oc","oj","om","or","os","pa","pi","pl","ps","pt","qu","rm","rn","ro","ru","rw","sa","sc","sd","se","sg","si","sk","sl","sm","sn","so","sq","sr","ss","st","su","sv","sw","ta","te","tg","th","ti","tk","tl","tn","to","tr","ts","tt","tw","ty","ug","uk","ur","uz","ve","vi","vo","wa","wo","xh","yi","yo","za","zh-CN","zh-TW","zu"];
  const dn = new Intl.DisplayNames(['en'], { type: 'language' });
  const langs = CODES.map(c => ({ c, n: dn.of(c) || c })).sort((a,b) => a.n.localeCompare(b.n));
  langs.forEach(l => { s.add(new Option(l.n, l.c)); t.add(new Option(l.n, l.c)); });
  s.value = 'en'; t.value = 'it';

  let lang = 'en';
  const openBox = id => document.getElementById(id).style.display = 'flex';
  const closeBox = id => document.getElementById(id).style.display = 'none';

  function toggleTheme() {
    document.body.classList.toggle('light');
    const isLight = document.body.classList.contains('light');
    themeBtn.innerText = isLight ? '🌑 Black Mode' : '☀ Light Mode';
    localStorage.setItem('clais_theme', isLight ? 'light' : 'black');
  }
  if (localStorage.getItem('clais_theme') === 'light') toggleTheme();

  function toggleLang() {
    lang = lang === 'en' ? 'it' : 'en';
    q.placeholder = lang === 'en' ? 'Enter any HTTPS website (e.g. youtube.com)...' : 'Inserisci un sito HTTPS (es. youtube.com)...';
    goBtn.innerText = lang === 'en' ? 'Go' : 'Vai';
  }

  function registerUser() {
    const first = fn.value.trim(), last = ln.value.trim(), mail = gm.value.trim().toLowerCase(), p1 = pw1.value, p2 = pw2.value;
    upErr.innerText = '';
    if (!first || !last || !mail || !p1 || !p2) { upErr.innerText = 'All fields are required.'; return; }
    if (!mail.endsWith('@gmail.com')) { upErr.innerText = 'Please enter a valid @gmail.com address.'; return; }
    if (p1.length < 11) { upErr.innerText = 'Password must be at least 11 characters.'; return; }
    if (!/[^a-zA-Z0-9\s]/.test(p1.slice(-1))) { upErr.innerText = 'Last character must be special (!@#$%^&*...).'; return; }
    if (p1 !== p2) { upErr.innerText = 'Passwords do not match.'; return; }
    let users = JSON.parse(localStorage.getItem('clais_accounts') || '{}');
    users[mail] = { first, last, mail, pass: p1 };
    localStorage.setItem('clais_accounts', JSON.stringify(users));
    localStorage.setItem('clais_logged', JSON.stringify(users[mail]));
    syncAuthUI(); closeBox('upBox');
  }

  function loginUser() {
    const mail = inGm.value.trim().toLowerCase(), pass = inPw.value;
    let users = JSON.parse(localStorage.getItem('clais_accounts') || '{}');
    if (users[mail] && users[mail].pass === pass) {
      localStorage.setItem('clais_logged', JSON.stringify(users[mail]));
      inErr.innerText = ''; syncAuthUI(); closeBox('inBox');
    } else { inErr.innerText = 'Wrong Gmail or Password. Please Sign Up first.'; }
  }

  function logout() { localStorage.removeItem('clais_logged'); syncAuthUI(); }

  function syncAuthUI() {
    const user = JSON.parse(localStorage.getItem('clais_logged') || 'null');
    usrBadge.innerText = user ? `👤 ${user.first} ${user.last}` : '';
    inBtn.style.display = user ? 'none' : 'inline-block';
    upBtn.style.display = user ? 'none' : 'inline-block';
    outBtn.style.display = user ? 'inline-block' : 'none';
  }

  async function trRun() {
    const q = tin.value.trim();
    if (!q) { tout.value = "Please type text first."; return; }
    tout.value = "Translating...";
    try {
      const r = await fetch(`https://googleapis.com{s.value}&tl=${t.value}&dt=t&q=${encodeURIComponent(q)}`);
      const d = await r.json();
      tout.value = d[0].map(x => x[0]).join("");
    } catch (e) {
      tout.value = "Translation error. Check internet connection.";
    }
  }

  syncAuthUI();
</script>
</body>
</html>
