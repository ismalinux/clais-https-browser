name: Build All OS
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install PyQt6 PyQt6-WebEngine pyinstaller
      - run: pyinstaller --noconsole --onefile --add-data "home.html;." --add-data "err.html;." --add-data "icon.svg;." --name "ClaisHTTPSBrowser" clais-browser
      - uses: actions/upload-artifact@v4
        with: { name: win, path: dist/ClaisHTTPSBrowser.exe }
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install PyQt6 PyQt6-WebEngine pyinstaller
      - run: |
          pyinstaller --windowed --add-data "home.html:." --add-data "err.html:." --add-data "icon.svg:." --name "ClaisHTTPSBrowser" clais-browser
          hdiutil create -volname "Clais HTTPS Browser" -srcfolder dist/ClaisHTTPSBrowser.app -ov -format UDZO ClaisHTTPSBrowser.dmg
          pkgbuild --install-location /Applications --component dist/ClaisHTTPSBrowser.app ClaisHTTPSBrowser.pkg
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: "*.dmg\n*.pkg" }
  release:
    needs: [win, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: cp *.deb *.rpm *.pkg.tar.zst out/ 2>/dev/null || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: Clais HTTPS Browser v1.0
          files: out/*
